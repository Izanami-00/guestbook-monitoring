name: guestbook-monitoring
runtime: nodejs
description: Kubernetes Guestbook (pulumi/examples kubernetes-ts-guestbook/components) with Prometheus + Grafana monitoring
template:
  config:
    isMinikube:
      description: Deploy to minikube (NodePort/ClusterIP services) instead of a cloud cluster (LoadBalancer)
      default: true
    loadgenEnabled:
      description: Run the in-cluster load generator against the frontend
      default: true
backend:
  # Local state in ~/.pulumi; no Pulumi Cloud account needed.
  url: file://~
